name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  python-locked-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          uv export --all-packages --all-groups --no-hashes --no-emit-workspace
          --format requirements.txt |
          uvx --python 3.13 --from pip-audit==2.10.1 pip-audit
          --requirement /dev/stdin --no-deps --disable-pip --progress-spinner off

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-repository-hygiene.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

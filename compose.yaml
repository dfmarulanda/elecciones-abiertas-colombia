name: elecciones-abiertas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elecciones
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elecciones"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - elecciones-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  elecciones-postgres:

            - heading "Lo que dice la gente" [level=2] [ref=e133]
          - paragraph [ref=e134]: Estos son los reclamos que más circulan sobre el resultado. Cada uno lleva la respuesta corta, el método que la sostiene y, cuando existe, el dato exacto que la confirma o la contradice. Dos de ellos no se pueden responder con lo que este sitio tiene, y así se dice.

            - heading "«Hubo mesas con votación atípica.»" [level=3] [ref=e149]
            - paragraph [ref=e150]: Atípico no significa imposible. Una mesa puede apartarse de sus vecinas por razones sociales, económicas o de composición del puesto, y por eso una desviación estadística solo sirve para que una persona la mire.

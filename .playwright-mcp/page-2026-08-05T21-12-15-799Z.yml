          - generic [ref=e136]:
            - paragraph [ref=e137]: Reclamo · verificable
            - heading "«El preconteo y el escrutinio no dieron lo mismo.»" [level=3] [ref=e138]
            - paragraph [ref=e139]: "Es cierto, y son exactamente seis votos en una sola mesa. Que una cifra se corrija entre el conteo rápido de la noche y el escrutinio revisado no es una anomalía: es el procedimiento haciendo lo que debe."

[project]
name = "elecciones-pipeline"
version = "0.1.0"
description = "Ingestion, document, reconciliation, analytics, and release pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.40.4",
  "duckdb>=1.3.2",
  "httpx>=0.28.1",
  "numpy>=2.3.2",
  "pillow>=11.3.0",
  "polars>=1.32.0",
  "pyarrow>=21.0.0",
  "pydantic>=2.11.7",
  "sqlalchemy>=2.0.42",
  "pydantic-settings>=2.10.1",
  "pymupdf>=1.26.3",
  "scipy>=1.16.1",
  "statsmodels>=0.14.5",
  "tenacity>=9.1.2",
  "typer>=0.16.0",
]

[project.scripts]
elecciones-pipeline = "elecciones_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elecciones_pipeline"]

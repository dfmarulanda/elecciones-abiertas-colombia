[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# Pin how Alembic splits the path options above. Without it Alembic 1.16+ warns
# and falls back to legacy splitting on spaces, commas and colons -- a fallback
# it intends to remove. apps/api/Dockerfile installs Alembic unpinned, so the
# preDeployCommand would start failing on whichever build first picks up that
# removal, on every push, with the migration never running.
path_separator = os
sqlalchemy.url = postgresql+psycopg://localhost/elecciones

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

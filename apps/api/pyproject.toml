[project]
name = "elecciones-api"
version = "0.1.0"
description = "Public FastAPI read API for Elecciones Abiertas Colombia"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16.4",
  "asyncpg>=0.30.0",
  "duckdb>=1.3.2,<2",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "orjson>=3.11.1",
  "psycopg[binary]>=3.2.9",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "redis>=6.4.0",
  "sentry-sdk[fastapi]>=2.34.1",
  "sqlalchemy[asyncio]>=2.0.42",
  "uvicorn[standard]>=0.35.0",
]

[project.scripts]
elecciones-api = "elecciones_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elecciones_api"]
